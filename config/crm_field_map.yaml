# SuiteCRM field mapping — swap keys when live vardefs are confirmed.
# Leads module: priority, classification_tags, and internal_summary require custom vardefs
# (or remap them below to existing Lead fields).
module: Leads

fields:
  name: pr_name
  email: email1
  phone: phone_work
  enquiry_type: client_type
  message: description
  company: account_name
  status: status
  priority: refered_by
  classification_tags: quotation_type
  internal_summary: pr_activity_description
  fathom_recording_id: fathom_recording_id
  meeting_scheduled_at: meeting_scheduled_at

enquiry_type_values:
  superyacht: "Superyacht Outfitting"
  residential: "Residential Project"
  aircraft: "Private Aircraft"
  general: "General Enquiry"

status_values:
  new: "New"
  classified: "Classified"
  draft_pending: "Draft Pending"
  responded: "Responded"
  brief_taken: "Brief Taken"
  closed: "Closed"

related_modules:
  contacts: Contacts
  accounts: Accounts
  meetings: Meetings
